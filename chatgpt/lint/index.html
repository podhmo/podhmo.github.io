<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yomiyasu lint (pyodide)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <style>
        .container {
            padding: 1rem;
            max-width: 800px;
        }
        #status {
            min-height: 1.5em;
        }
        .finding {
            border-left: 4px solid #666;
            padding: 0.25rem 0.75rem;
            margin-bottom: 0.75rem;
        }
        .finding[data-severity="error"] {
            border-left-color: #d93526;
        }
        .finding[data-severity="warn"] {
            border-left-color: #e6930d;
        }
        .finding pre {
            font-size: 0.85em;
            margin: 0.25rem 0 0;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .metrics {
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>yomiyasu lint</h1>
        <p>
            <a href="https://github.com/nanaism/yomiyasu">nanaism/yomiyasu</a> の
            <a href="https://github.com/nanaism/yomiyasu/blob/main/skills/yomiyasu/scripts/yomiyasu_lint.py">yomiyasu_lint.py</a>
            を、ブラウザ内の pyodide (CPython WASM) で実行して日本語文章のAIっぽさを機械検査します。
            入力テキストはブラウザの外へ送られません。
        </p>

        <label for="inputText">検査するテキスト</label>
        <textarea id="inputText" rows="12" placeholder="ここに検査したい日本語テキストを貼り付ける"></textarea>
        <button id="runButton">Lint を実行</button>
        <p><small id="status"></small></p>

        <section id="resultArea" hidden>
            <h2 id="scoreLine"></h2>
            <p class="metrics" id="metricsLine"></p>
            <div id="findingsArea"></div>
        </section>

        <hr />
        <footer>
            <small>
                Powered by <a href="https://pyodide.org">pyodide</a> (CDN 配信・実行時ロード) /
                lint スクリプトは実行時に upstream (main) から取得します
                <br />
                <a href="../">Prompt Template Clipper</a> /
                <a href="https://github.com/podhmo/podhmo.github.io/tree/master/chatgpt">GitHub</a>
            </small>
        </footer>
    </main>
    <script type="module" src="./app.js"></script>
</body>
</html>
